<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anilyfe — The Anime Marketplace</title>
<link rel="icon" href="assets/logos/logo.png" onerror="this.remove()" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- Design system, split from the original single-file prototype -->
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<!--
  ANILYFE — pure HTML/CSS/JS prototype · localStorage data
  This is a single-page app: every "page" in /pages and /admin is a
  hash route rendered into #app by js/navigation.js. The scripts below
  are plain, non-module scripts loaded in dependency order and sharing
  one global scope — functionally identical to the original one-file
  prototype, just split up for readability and reuse. app.js is loaded
  last because it boots the app (seed() + route()) once everything else
  has been defined.
-->
<script src="js/mock-data.js"></script>
<script src="js/notifications.js"></script>
<script src="js/search.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
<script src="js/products.js"></script>
<script src="js/sellers.js"></script>
<script src="js/admin.js"></script>
<script src="js/auth.js"></script>
<script src="js/feed.js"></script>
<script src="js/marketplace.js"></script>
<script src="js/anime.js"></script>
<script src="js/manga.js"></script>
<script src="js/communities.js"></script>
<script src="js/shorts.js"></script>
<script src="js/messaging.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
