<!DOCTYPE html>
<html lang="en">
<head>
<meta name="anilyfe-api" content="http://localhost:4000">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anilyfe — The Anime Marketplace</title>
<link rel="icon" href="assets/logos/logo.png" onerror="this.remove()" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
<!-- Tailwind v3 runtime (reads the SAME theme as tailwind.config.js). For production, run `npm run build:css` and remove this block. -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { anilyfe: {50:'#F6FCFF',100:'#E7F1FF',200:'#D0E3FF',300:'#9FB8EE',400:'#708BD1',500:'#334EAC',600:'#233D92',700:'#081F5C',800:'#071B52',900:'#041338'}, success:'#1F9D55', warning:'#B7791F', error:'#B42318', info:'#2563EB' },
    fontFamily: { sans:['Manrope','sans-serif'], display:['Sora','sans-serif'], tech:['Chakra Petch','sans-serif'] },
    borderRadius: { anilyfe:'16px' },
    boxShadow: { card:'0 10px 30px -18px rgba(8,31,92,.25)', lift:'0 24px 48px -20px rgba(8,31,92,.35)', glow:'0 0 60px rgba(72,142,255,.35)' }
  } }
};
</script>
<style type="text/tailwindcss">
  @layer base { html{scroll-behavior:smooth} body{font-family:'Manrope',sans-serif} h1,h2,h3,h4{font-family:'Sora',sans-serif} }
  @layer components {
    .anilyfe-btn{@apply inline-flex items-center justify-center gap-2 rounded-xl px-5 py-2.5 text-sm font-bold transition duration-200 focus:outline-none focus:ring-2 focus:ring-anilyfe-400 focus:ring-offset-2}
    .anilyfe-btn-primary{@apply anilyfe-btn bg-anilyfe-500 text-white hover:bg-anilyfe-600}
    .anilyfe-btn-secondary{@apply anilyfe-btn border border-anilyfe-200 bg-white text-anilyfe-700 hover:border-anilyfe-400 hover:bg-anilyfe-50}
    .anilyfe-card{@apply rounded-anilyfe border border-anilyfe-200 bg-white shadow-card}
    .anilyfe-input{@apply w-full rounded-xl border border-anilyfe-200 bg-white px-3.5 py-2.5 text-sm text-anilyfe-700 outline-none transition focus:border-anilyfe-500 focus:ring-4 focus:ring-anilyfe-500/10}
    .anilyfe-badge{@apply inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-extrabold uppercase tracking-wide}
    .anilyfe-art{@apply block w-full rounded-3xl border border-white/20 object-cover shadow-glow}
  }
</style>
<link rel="stylesheet" href="css/tailwind.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- Design system, split from the original single-file prototype -->
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div id="anilyfe-splash" class="fixed inset-0 z-[99999] flex min-h-screen items-center justify-center overflow-hidden bg-anilyfe-800 text-white transition-opacity duration-500" role="status" aria-live="polite">
  <img src="assets/images/splash.png" width="360" height="640" alt="" class="absolute inset-0 h-full w-full object-cover opacity-70" loading="eager" onerror="this.remove()">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_38%,rgba(86,142,255,.28),transparent_42%),linear-gradient(180deg,rgba(7,27,82,.55),rgba(7,27,82,.92))]"></div>
  <div class="relative z-10 flex flex-col items-center px-6 text-center">
    <div class="relative mb-6 h-40 w-40 sm:h-48 sm:w-48">
      <svg viewBox="0 0 96 96" class="h-full w-full" fill="none" width="192" height="192">
        <rect x="10" y="10" width="76" height="76" rx="24" fill="#E7F1FF" stroke="#334EAC" stroke-width="3"/>
        <path d="M31 42c5-9 29-9 34 0" stroke="#334EAC" stroke-width="4" stroke-linecap="round"/>
        <circle cx="34" cy="52" r="5" fill="#334EAC"/>
        <circle cx="62" cy="52" r="5" fill="#334EAC"/>
        <path d="M36 67c7 5 17 5 24 0" stroke="#334EAC" stroke-width="4" stroke-linecap="round"/>
        <path d="M48 10v-6M28 14l-4-5M68 14l4-5" stroke="#708BD1" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <img src="assets/images/loader-mascot.png" width="512" height="512" alt="ANILyfe mascot" class="absolute inset-0 h-full w-full object-contain" loading="eager" onload="var v=this.parentNode.querySelector('svg');if(v)v.style.display='none'" onerror="this.style.display='none'">
    </div>
    <div class="font-tech text-[11px] uppercase tracking-[.42em] text-[#9BC7FF]">ANILyfe</div>
    <h1 class="mt-2 font-display text-2xl font-black tracking-tight sm:text-3xl">Enter the anime marketplace.</h1>
    <div class="mt-7 h-1.5 w-52 overflow-hidden rounded-full bg-white/10"><div class="h-full w-1/2 rounded-full bg-gradient-to-r from-[#7FB0FF] to-white animate-[anilyfe-loading_1.1s_ease-in-out_infinite]"></div></div>
    <p id="anilyfe-splash-msg" class="mt-4 min-h-[1.25rem] text-xs text-white/70">Connecting to marketplace data...</p>
  </div>
</div>
<div id="anilyfe-route-loader" class="fixed inset-0 z-[99998] hidden items-center justify-center bg-anilyfe-800/90 text-white backdrop-blur-md" aria-live="polite" aria-hidden="true">
  <div class="px-6 text-center">
    <div class="relative mx-auto h-24 w-24">
      <svg viewBox="0 0 96 96" class="h-full w-full" fill="none" width="96" height="96">
        <rect x="10" y="10" width="76" height="76" rx="24" fill="#E7F1FF" stroke="#334EAC" stroke-width="3"/>
        <path d="M31 42c5-9 29-9 34 0" stroke="#334EAC" stroke-width="4" stroke-linecap="round"/>
        <circle cx="34" cy="52" r="5" fill="#334EAC"/>
        <circle cx="62" cy="52" r="5" fill="#334EAC"/>
        <path d="M36 67c7 5 17 5 24 0" stroke="#334EAC" stroke-width="4" stroke-linecap="round"/>
        <path d="M48 10v-6M28 14l-4-5M68 14l4-5" stroke="#708BD1" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <img src="assets/images/loader-mascot.png" width="512" height="512" alt="" class="absolute inset-0 h-full w-full object-contain" loading="eager" onload="var v=this.parentNode.querySelector('svg');if(v)v.style.display='none'" onerror="this.style.display='none'">
    </div>
    <div class="mt-3 font-tech text-[10px] uppercase tracking-[.28em] text-[#9BC7FF]">ANILyfe</div>
    <div class="mt-2 text-sm font-bold">Loading marketplace view...</div>
    <div class="mx-auto mt-4 h-1 w-32 overflow-hidden rounded-full bg-white/10"><div class="h-full w-1/2 bg-[#7FB0FF] animate-[anilyfe-loading_900ms_ease-in-out_infinite]"></div></div>
  </div>
</div>
<script>
(function(){var m=['Connecting to marketplace data...','Loading marketplace catalog...','Preparing checkout services...','Synchronizing marketplace...'],i=0,el=document.getElementById('anilyfe-splash-msg');if(!el)return;var t=setInterval(function(){if(!document.getElementById('anilyfe-splash-msg')){clearInterval(t);return}i=(i+1)%m.length;el.textContent=m[i]},1400)})();
</script>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<!-- ANILyfe V1: API/database is the source of truth for marketplace data. -->
<!-- Service Layer (Backend Abstraction) -->
<script src="js/services/sellerService.js"></script>
<script src="js/services/productService.js"></script>
<script src="js/services/orderService.js"></script>
<script src="js/services/inventoryService.js"></script>
<script src="js/services/reviewService.js"></script>
<script src="js/services/analyticsService.js"></script>
<script src="js/services/deliveryService.js"></script>
<script src="js/services/storeService.js"></script>
<script src="js/services/settingsService.js"></script>
<script src="js/services/notificationService.js"></script>
<script src="js/services/verificationService.js"></script>
<script src="js/services/payoutService.js"></script>
<script src="js/services/paymentService.js"></script>
<script src="js/services/auditService.js"></script>
<script src="js/services/adminNotificationService.js"></script>

<script src="js/components.js"></script>
<script src="js/core-data.js"></script>
<script src="js/feed.js"></script>
<script src="js/notifications.js"></script>
<script src="js/search.js"></script>
<script src="js/cart.js"></script>
<script src="js/products.js"></script>
<script src="js/admin.js"></script>
<script src="js/auth.js"></script>

<script src="js/marketplace.js"></script>



<script src="js/seller-center.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
<script src="js/api-integration.js"></script>
</body>
</html>
